<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojinha da unidade</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funcoes.js" defer></script>
</head>
<body>
    <div class="container">
        <main>
            <h1 class="mb-4"><i class="bi bi-cart-plus-fill" aria-hidden="true"></i> Lojinha da unidade</h1>

            <div class="table-responsive">
                <table class="table table-striped table-bordered align-middle text-center">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Imagem</th>
                            <th scope="col">Produto</th>
                            <th scope="col">Preço unitário</th>
                            <th scope="col">Quantidade</th>
                            <th scope="col">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr data-product-id="1" data-price-cents="200000">
                            <td>
                                <img class="img-fluid rounded" src="img/produto_1.webp"
                                    alt="Celular Somasong cinza" width="150" height="200">
                            </td>
                            <td class="text-start">
                                <div>Celular Somasong</div>
                                <small class="text-muted"><span class="destaque">Código: 12345</span></small><br>
                                <small class="text-muted"><span class="destaque">Cor: cinza</span></small>
                            </td>
                            <td>R$ 2.000,00</td>
                            <td>
                                <div class="quantity-controls">
                                    <button class="btn btn-secondary btn-sm" type="button"
                                        data-action="decrease" aria-label="Diminuir quantidade de Celular Somasong">
                                        <i class="bi bi-dash-lg" aria-hidden="true"></i>
                                    </button>
                                    <span id="qtd_1" aria-live="polite">0</span>
                                    <button class="btn btn-secondary btn-sm" type="button"
                                        data-action="increase" aria-label="Aumentar quantidade de Celular Somasong">
                                        <i class="bi bi-plus-lg" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </td>
                            <td id="total_1">R$ 0,00</td>
                        </tr>
                        <tr data-product-id="2" data-price-cents="100000">
                            <td>
                                <img class="img-fluid rounded" src="img/produto_2.webp"
                                    alt="Televisor preto" width="150" height="200">
                            </td>
                            <td class="text-start">
                                <div>Televisor</div>
                                <small class="text-muted"><span class="destaque">Código: 12346</span></small><br>
                                <small class="text-muted"><span class="destaque">Cor: preto</span></small>
                            </td>
                            <td>R$ 1.000,00</td>
                            <td>
                                <div class="quantity-controls">
                                    <button class="btn btn-secondary btn-sm" type="button"
                                        data-action="decrease" aria-label="Diminuir quantidade de Televisor">
                                        <i class="bi bi-dash-lg" aria-hidden="true"></i>
                                    </button>
                                    <span id="qtd_2" aria-live="polite">0</span>
                                    <button class="btn btn-secondary btn-sm" type="button"
                                        data-action="increase" aria-label="Aumentar quantidade de Televisor">
                                        <i class="bi bi-plus-lg" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </td>
                            <td id="total_2">R$ 0,00</td>
                        </tr>
                        <tr data-product-id="3" data-price-cents="100000">
                            <td>
                                <img class="img-fluid rounded" src="img/produto_3.webp"
                                    alt="Notebook preto" width="130" height="100">
                            </td>
                            <td class="text-start">
                                <div>Notebook</div>
                                <small class="text-muted"><span class="destaque">Código: 12347</span></small><br>
                                <small class="text-muted"><span class="destaque">Cor: preto</span></small>
                            </td>
                            <td>R$ 1.000,00</td>
                            <td>
                                <div class="quantity-controls">
                                    <button class="btn btn-secondary btn-sm" type="button"
                                        data-action="decrease" aria-label="Diminuir quantidade de Notebook">
                                        <i class="bi bi-dash-lg" aria-hidden="true"></i>
                                    </button>
                                    <span id="qtd_3" aria-live="polite">0</span>
                                    <button class="btn btn-secondary btn-sm" type="button"
                                        data-action="increase" aria-label="Aumentar quantidade de Notebook">
                                        <i class="bi bi-plus-lg" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </td>
                            <td id="total_3">R$ 0,00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer class="border-top pt-3 text-end">
            <strong>Subtotal: <span id="subtotal">R$ 0,00</span></strong>
        </footer>
    </div>
</body>
</html>
