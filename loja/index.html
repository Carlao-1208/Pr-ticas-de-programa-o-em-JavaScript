<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
    <title>Lojinha da unidade</title>
    <i class="bi bi-cart-plus-fill"></i>
    
    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

        
</head>
<body>
    <div class="container">
        <main>
            <h1 class="mb-4"><i class="bi bi-cart-plus-fill"></i>Lojinha da unidade</h1>

            <div class="table-responsive" table-dark table striped table-bordered align-middle text-center>
                <table class="table table-striped table-bordered align-middle text-center">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Imagem</th>
                            <th scope="col">Produto</th>
                            <th scope="col">Preço unitário</th>
                            <th scope="col">Quantidade</th>
                            <th scope="col">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <img
                                    class="img-fluid rounded"
                                    src="img/produto_1.webp"
                                    alt="Celular Somasong preto"
                                    width="150"
                                    height="200"
                                >
                            </td>
                            <td class="text-start">
                                <div>Celular Somasong</div>
                                <small class="text-muted">Código: 12345</small><br>
                                <small class="text-muted">Cor: Preto</small>
                            </td>
                            <td>R$ 1.000,00</td>
                            <td>
                                <span class="badge text-bg-secondary">New</span>
                                0
                                <span class="badge text-bg-secondary">New</span>
                            </td>
                            <td>R$ 0,00</td>
                        </tr>
                        <tr>
                            <td>
                                <img
                                    class="img-fluid rounded"
                                    src="img/produto_2.webp"
                                    alt="Televisor preto"
                                    width="150"
                                    height="200"
                                >
                            </td>
                            <td class="text-start">
                                <div>Televisor</div>
                                <small class="text-muted">Código: 12345</small><br>
                                <small class="text-muted">Cor: Preto</small>
                            </td>
                            <td>R$ 1.000,00</td>
                            <td>0</td>
                            <td>R$ 0,00</td>
                        </tr>
                        <tr>
                            <td>
                                <img
                                    class="img-fluid rounded"
                                    src="img/produto_3.webp"
                                    alt="Notebook preto"
                                    width="130"
                                    height="100"
                                >
                            </td>
                            <td class="text-start">
                                <div>Notebook</div>
                                <small class="text-muted">Código: 12345</small><br>
                                <small class="text-muted">Cor: Preto</small>
                            </td>
                            <td>R$ 1.000,00</td>
                            <td>0</td>
                            <td>R$ 0,00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer class="border-top pt-3 text-end">
            <strong>Subtotal: R$ 0,00</strong>
        </footer>
    </div>
</body>
</html>
