<!DOCTYPE html>
<html>
    <head>
        <title> estruturas de condição</title>

        <script>

            /* verificar o aumento de salário de acordo com os seguintes cargos:
            Estagiário: 100%
            Analista:50%
            Gerente:30%
            Presidente: 10%
            */
           const salario = prompt("Digite o salario")
           const cargo = prompt("Digite o cargo")
           let aumento = 0
           
            switch(cargo){
            case "Estagiário": aumento = 2; break;
            case "Analista": aumento = 1.5; break;
            case "Gerente": aumento = 1.3; break;
            case "Presidente": aumento = 1.1; break;
            default: alert("Favor, escolher cargo válido!")
        }

        // const novo_salario = salario +(salario * aumento)
        // const novo_salario = salario * (1 + aumento)
        const novo_salario = salario * aumento

        console.log("O novo salario é: R$ " + novo_salario)

        </script>

    </head>
    <body>

    </body>
</html>
